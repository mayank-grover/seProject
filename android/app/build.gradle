plugins { id 'com.android.application' }

def signingFile = rootProject.file('../.android-signing/signing.properties')
def signingProps = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'com.mayankgrover.stillspace'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.mayankgrover.stillspace'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile rootProject.file('../.android-signing/stillspace-release.jks')
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    sourceSets.main.assets.srcDirs = ['../../dist']
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0' }
